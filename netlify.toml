[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  # El catálogo base y las vistas EJS viajan junto a la función serverless
  included_files = ["data/inventario.json", "src/views/**"]
  external_node_modules = ["sharp", "firebase-admin"]

# API y panel administrativo -> función Express
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admin"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/admin/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# Vistas SSR (Netlify sirve primero estáticos en dist/ como /assets/*)
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api"
  status = 200

# Encabezados de seguridad para todo el sitio estático
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
